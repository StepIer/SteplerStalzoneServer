ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.stepler.plugins.HTTPKt.configureHTTP
      - com.stepler.plugins.MonitoringKt.configureMonitoring
      - com.stepler.plugins.SerializationKt.configureSerialization
      - com.stepler.plugins.StatusPagesKt.configureStatusPages
      - com.stepler.RoutingKt.configureRouting

cors:
  # Browser origins allowed to call this API, as host[:port] with no scheme.
  # Comma-separated; empty means no cross-origin access.
  # Override per-environment with CORS_ALLOWED_HOSTS, e.g. "localhost:3000".
  allowedHosts: "$CORS_ALLOWED_HOSTS:"
